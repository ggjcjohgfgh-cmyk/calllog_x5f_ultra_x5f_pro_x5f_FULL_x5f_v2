  telephony: ^0.2.0
  record: ^5.0.4
  just_audio: ^0.9.39
  device_info_plus: ^9.1.1
  crypto: ^3.0.3
  local_auth: ^2.1.7
  flutter_phone_direct_caller: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true